
x-proxy-settings: &proxy-config
  HTTP_PROXY: "http://privoxy:8118"
  HTTPS_PROXY: "http://privoxy:8118"
  NO_PROXY: "127.0.0.1,localhost,redroid,filebrowser,scrcpy-web"

services:
  # 1. Android Emulator
  redroid:
    image: redroid/redroid:13.0.0-latest
    container_name: redroid
    restart: unless-stopped
    privileged: true
    ports:
      - "5555:5555"
    volumes:
      - ./data/redroid:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_gpu_mode=host
      # Point to Privoxy
      - androidboot.redroid_net_proxy_type=http
      - androidboot.redroid_net_proxy_host=privoxy
      - androidboot.redroid_net_proxy_port=8118
      - androidboot.redroid_net_proxy_exclude_list=localhost,scrcpy-web

  # 2. Mobile Security Framework
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: mobsf
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/mobsf:/root/.MobSF
    environment:
      <<: *proxy-config
      MOBSF_PLATFORM_URL: "http://redroid:5555"
    depends_on:
      - redroid
      - privoxy

  # 3. Web-based Screen Control (ws-scrcpy)
  scrcpy-web:
    image: smanx/ws-scrcpy:latest
    container_name: scrcpy-web
    restart: unless-stopped
    ports:
      - "8002:8000"  # Access at http://IP:8002
    depends_on:
      - redroid
    # Wait for Redroid to boot, then connect
    command: sh -c "adb connect redroid:5555 && node dist/index.js"

  # 4. File Manager
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "8003:80"    # Access at http://IP:8003
    volumes:
      - ./data:/srv  # Manages the data folders for Redroid/MobSF
      - ./filebrowser.db:/database.db

  # 5. The Switchboard (Privoxy)
  privoxy:
    image: vimagick/privoxy
    container_name: privoxy
    restart: unless-stopped
    volumes:
      - ./data/privoxy/config:/etc/privoxy/config
    ports:
      - "8118:8118" # Expose if you want to use it from your PC too

  # 6. Tor SOCKS5 Proxy
  tor-proxy:
    image: peterdavehello/tor-socks-proxy:latest
    container_name: tor-proxy
    restart: unless-stopped
    volumes:
      - ./data/tor/torrc:/etc/tor/torrc
    ports:
      - "9050:9150" # Expose SOCKS5 port

# 7. Dashboard (Homepage)
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "80:3000"
    volumes:
      - ./data/homepage/config:/app/config
      # Mount Docker socket so it can see if containers are running (optional status dots)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - APP_IP=192.168.100.19

volumes:
  redroid-data:
  mobsf-data:
