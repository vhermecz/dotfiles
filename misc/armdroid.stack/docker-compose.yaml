
x-proxy-settings: &proxy-config
  HTTP_PROXY: "http://tor-gateway:8118"
  HTTPS_PROXY: "http://tor-gateway:8118"
  NO_PROXY: "127.0.0.1,localhost,redroid,filebrowser,scrcpy-web"

services:
  # 1. Android Emulator
  redroid:
    image: redroid/redroid:11.0.0-latest  # MobSf requires API level 30 for dynamic anal
    # image: iceblacktea/redroid-arm64:12.0.0-250116  # NOTE: No v11 avail anymore
    container_name: redroid
    restart: unless-stopped
    privileged: true
    ports:
      - "5555:5555"
    volumes:
      - ./data/redroid:/data
      - /dev/mali0:/dev/mali0       # 👈 Pass the GPU hardware
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap # 👈 This is the missing piece
      - /dev/graphics:/dev/graphics # 👈 Pass the display nodes
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_gpu_mode=guest
      - redroid.gpu.node=/dev/dri/renderD128 # 👈 Specify the node
      - androidboot.redroid_use_angle=0   # 👈 Disable the layer causing the crash
      #- androidboot.redroid_gpu_mode=mali # 👈 Force Mali acceleration (other values: host, guest)
      - androidboot.redroid_fps=60
      - androidboot.redroid_no_bluetooth=1  # NOTE: This is halucination probably
      - "ro.boot.wificountry=US"
      - "ro.bluetooth.library_name=null"
      - "persist.bluetooth.enabled=false" # 👈 This is the standard Android property
      - persist.sys.timezone=UTC
      - persist.google.gms.disable=1       # Disable GMS if you don't need Play Store
      - ro.kernel.android.checkjni=0       # Speed up the runtime
      - ro.telephony.default_network=9     # Stop looking for a modem/SIM
      # Point to Privoxy
      - androidboot.redroid_net_proxy_type=http
      - androidboot.redroid_net_proxy_host=tor-gateway
      - androidboot.redroid_net_proxy_port=8118
      - androidboot.redroid_net_proxy_exclude_list=localhost,scrcpy-web
    depends_on:
      - tor-gateway

  # 2. Mobile Security Framework
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: mobsf
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./data/mobsf:/root/.MobSF
    environment:
      <<: *proxy-config
      MOBSF_ANALYZER_IDENTIFIER: "redroid:5555"
      MOBSF_ADB_ROOT: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - redroid
      - tor-gateway

  # 3. Web-based Screen Control (ws-scrcpy)
  scrcpy-web:
    image: smanx/ws-scrcpy:latest
    container_name: scrcpy-web
    restart: unless-stopped
    ports:
      - "8002:8000"  # Access at http://IP:8002
    depends_on:
      - redroid
    # Wait for Redroid to boot, then connect
    command: sh -c "adb connect redroid:5555 && node dist/index.js"

  # 4. File Manager
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "8003:80"    # Access at http://IP:8003
    volumes:
      - ./data:/srv  # Manages the data folders for Redroid/MobSF
      - ./filebrowser.db:/database.db

  # 5. The Switchboard (Privoxy, Tor SOCKS5 Proxy)
  tor-gateway:
    image: ghcr.io/avpnusr/torprivoxy:latest
    container_name: tor-gateway
    restart: unless-stopped
    volumes:
      # These use the same config logic we set up
      - ./data/tor/torrc:/etc/tor/torrc
      - ./data/privoxy/config:/etc/privoxy/config
    ports:
      - "8118:8118" # Privoxy Port
      - "9050:9050" # Tor SOCKS Port

  # 6. Dashboard (Homepage)
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "80:3000"
    volumes:
      - ./data/homepage/config:/app/config
      # Mount Docker socket so it can see if containers are running (optional status dots)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOMEPAGE_VAR_APP_IP=192.168.100.19
      - HOMEPAGE_ALLOWED_HOSTS=192.168.100.19

volumes:
  redroid-data:
  mobsf-data:
